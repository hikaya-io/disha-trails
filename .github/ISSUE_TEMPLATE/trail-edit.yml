name: Trail edit
description: Suggest a change to a published guide, like a dry spring, a closed hut or a reroute.
title: "Trail edit: <trail name> [<trail-id>]"
labels: [trail-edit]
body:
  - type: markdown
    attributes:
      value: |
        Check the [open edits](https://github.com/hikaya-io/disha-trails/issues?q=is%3Aissue+is%3Aopen+label%3Atrail-edit) first.
        If someone already reported it, add a 👍 to that issue. Edits with the most 👍 are made first.

        Keep the `[trail-id]` in the title so the edit shows on the trail's page.
  - type: dropdown
    id: kind
    attributes:
      label: What needs changing?
      options:
        - Distance or elevation is wrong
        - Add a stop (water, hut, campsite, shop, viewpoint)
        - Update or remove a stop (dry spring, closed hut, wrong place)
        - The route has changed (reroute, closure, washed-out section)
        - New alternate or variant
        - Conditions (snow, hazard, seasonal note)
        - Something else
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: A stop's name, a distance along the trail, coordinates or a map link.
      placeholder: "e.g. Refuge de Petra Piana, or km 84 from Calenzana"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or new?
      description: What you saw and what the guide should say instead.
      placeholder: "e.g. The spring below the col was dry in late August."
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did you see it?
      description: A date, or a month and year.
      placeholder: "e.g. 2026-08-24, or August 2026"
  - type: textarea
    id: source
    attributes:
      label: Photo, GPX or source
      description: Add a photo or GPX file, or link a notice from a park, trail group or hut.
