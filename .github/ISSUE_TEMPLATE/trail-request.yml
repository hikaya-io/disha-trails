name: Trail request
description: Ask for a trail, its offline map or its guide. Vote 👍 or 👎 on an existing request instead.
title: "Trail request: <trail name> [<trail-id>]"
labels: [trail-request]
body:
  - type: markdown
    attributes:
      value: |
        One request per trail. If the trail already has one, vote on that issue instead of
        opening a new one: 👍 to build it, 👎 if it isn't a priority. Votes decide what is built
        next, and they only count in one place.

        Keep the `[trail-id]` in the title: it links this request to the trail's page.
  - type: dropdown
    id: want
    attributes:
      label: What matters most to you?
      description: A guide always comes with its offline map.
      options:
        - A curated Disha guide
        - Offline maps along the trail
        - Both
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Route link
      description: An OpenStreetMap relation, Wikiloc, AllTrails or official page. A GPX link is best.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
  - type: textarea
    id: why
    attributes:
      label: Anything else?
      description: When you plan to hike it, which sections matter most, or nearby day hikes.
