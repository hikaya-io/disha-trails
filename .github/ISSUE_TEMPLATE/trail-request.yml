name: Trail request
description: Ask for a trail's guide or offline map.
title: "Trail request: <trail name> [<trail-id>]"
labels: [trail-request]
body:
  - type: markdown
    attributes:
      value: |
        One request per trail. If it already has one, vote on that issue instead: 👍 to build it,
        👎 if it isn't a priority. Votes decide what is built next.

        Keep the `[trail-id]` in the title so the request shows on the trail's page.
  - type: dropdown
    id: want
    attributes:
      label: What matters most to you?
      description: A guide comes with its offline map.
      options:
        - A curated Disha guide
        - Offline maps along the trail
        - Both
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Route link
      description: A GPX link is best. An OpenStreetMap, Wikiloc, AllTrails or official page also works.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Country
  - type: textarea
    id: why
    attributes:
      label: Anything else?
      description: When you plan to hike it, or which sections matter most.
